[project]
name = "engram-mcp"
version = "0.1.0"
description = "Grok-powered MCP server for the Engram Personal Operating System (POS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.0",
]

[project.scripts]
engram-mcp = "engram_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram_mcp"]